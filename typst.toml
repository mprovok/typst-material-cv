[package]
name = "material-cv"
version = "0.1.0"
authors = ["mprovok <https://github.com/mprovok>", "tsnobip <https://github.com/tsnobip>"]
license = "MIT"
description = "A stylish and customizable résumé template for Typst, designed with elegant typographic variations."
categories = ["cv"]
keywords = ["CV", "Curriculum Vitae", "Resume", "Minimal", "Typographic", "Professional", "Material Design", "Google Sans"]
repository = "https://github.com/mprovok/typst-material-cv"
exclude = ["*.pdf", "profile_pic_example.jpg"]
entrypoint = "package.typ"

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
